[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitcore-audio"
version = "1.0.0"
description = "ViT-CORE-Audio: dual-view (mel + CQT) audio anti-spoofing model — shared package for both the training scripts (train.py/evaluate.py) and the backend/ inference service."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Only needed for train.py/evaluate.py, not for backend/'s inference path —
# kept separate so `pip install -e ".[training]"` is explicit about it.
training = [
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.14.0",
]

[tool.setuptools.packages.find]
include = ["vitcore_audio*"]
